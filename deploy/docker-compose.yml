# Локальная инфраструктура проекта.
# Запуск:  cd deploy && docker compose up -d
# Логи:    docker compose logs -f postgres
# Стоп:    docker compose down        (данные сохраняются в томах)
#
# Все пароли ниже — ТОЛЬКО для локальной разработки.
# На сервере они задаются через .env (см. .env.example) и не попадают в git.

name: discord_clone

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL — единственный источник истины
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    container_name: dc_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-discord_clone}
      POSTGRES_USER: ${POSTGRES_USER:-dc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # $$ — чтобы Compose не подставлял переменную, а передал её в контейнер
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    logging: *default-logging
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Redis — presence, pub/sub между узлами шлюза, кэш прав, rate limit.
  # Персистентность намеренно выключена: всё это восстановимо.
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: dc_redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    logging: *default-logging
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # SeaweedFS — S3-совместимое хранилище для вложений и аватарок.
  #
  # Почему не MinIO: его образы недоступны анонимно (Docker Hub — pull access
  # denied, quay — 401). SeaweedFS отдаёт тот же S3 API, а код работает через
  # стандартный клиент, поэтому переезд на Cloudflare R2 или Backblaze B2 —
  # это смена адреса и ключей, а не переписывание.
  #
  # S3 endpoint: http://localhost:8333
  # ---------------------------------------------------------------------------
  storage:
    image: chrislusf/seaweedfs:latest
    container_name: dc_storage
    command: server -s3 -s3.port=8333 -dir=/data -s3.config=/etc/seaweedfs/s3.json
    volumes:
      - seaweeddata:/data
      - ./seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    ports:
      - "${STORAGE_PORT:-8333}:8333"
    logging: *default-logging
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # LiveKit — SFU для голоса и видео.
  # Конфиг: deploy/livekit.yaml (ключи devkey/secret, вебхуки на Go-сервер).
  # Годится только для localhost и локальной сети, без TLS.
  # ---------------------------------------------------------------------------
  livekit:
    image: livekit/livekit-server:latest
    container_name: dc_livekit
    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "7880:7880"      # HTTP + WebSocket (сигналинг)
      - "7881:7881"      # TCP fallback для WebRTC
      - "7882:7882/udp"  # UDP mux (медиа)
    logging: *default-logging
    restart: unless-stopped

volumes:
  pgdata:
  seaweeddata:
