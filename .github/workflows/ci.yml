name: CI

# Уровень 3 проверки: чистое окружение, Linux, живой PostgreSQL.
# Запускается на каждый push в main и на каждый pull request.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go — линтер, тесты, сборка, миграции
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: discord_clone
          POSTGRES_USER: dc
          POSTGRES_PASSWORD: devpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dc -d discord_clone"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    env:
      DATABASE_URL: postgres://dc:devpass@localhost:5432/discord_clone?sslmode=disable
      REDIS_URL: redis://localhost:6379/0
      STORAGE_ENDPOINT: localhost:8333
      STORAGE_ACCESS_KEY: dcstorage
      STORAGE_SECRET_KEY: devstorage123

    steps:
      - uses: actions/checkout@v4

      - name: Запустить SeaweedFS
        run: |
          # Сервис-контейнеры GitHub не умеют монтировать файл из репозитория:
          # checkout происходит позже. Поэтому поднимаем хранилище шагом.
          docker run -d --name dc_storage -p 8333:8333 \
            -v "$PWD/deploy/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro" \
            chrislusf/seaweedfs:latest \
            server -s3 -s3.port=8333 -dir=/data -s3.config=/etc/seaweedfs/s3.json

          for i in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/8333) 2>/dev/null; then
              echo "хранилище готово за ${i}с"
              exit 0
            fi
            sleep 1
          done
          echo "хранилище не поднялось"
          docker logs dc_storage
          exit 1

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Применить схему БД
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/001_init.sql

      - name: Применить демо-данные
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/002_seed.sql

      - name: golangci-lint
        run: |
          # Ставим линтер через go install, а не через сторонний action:
          # action тянет свою старую сборку и падает с exit 3 на Go 1.27.
          # Собранный нашим Go линтер всегда понимает нашу версию языка.
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          "$(go env GOPATH)/bin/golangci-lint" run --timeout=3m

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: go build
        run: go build ./...

      - name: Проверить форматирование
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Не отформатировано:"
            echo "$unformatted"
            exit 1
          fi

  # Клиент появится на этапе 0.5 — тогда добавим job для Flutter:
  # flutter analyze + flutter test на ubuntu-latest.
